<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>matthis ~ tthisk.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<!--
  Design 11: the home page is a session with a coding agent running in a
  terminal. The visitor asks, the agent "reads files" and answers. Builds on
  08 (same palette and type), but only the intro is on screen at first.
-->
<style>
  :root {
    --bg: #0f1114;
    --panel: #171a1f;
    --fg: #c8ccd2;
    --bright: #eceff3;
    --dim: #6c727d;
    --faint: #2a2e35;
    --line: #3a3f48;
    --green: #9ece8a;
    --amber: #e2c08d;
    --blue: #8fb8de;
    --red: #e88383;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem 2rem 0;
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 15px;
    line-height: 1.6;
    color: var(--fg);
    -webkit-text-size-adjust: 100%;
    font-variant-ligatures: none;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  ::selection { background: var(--green); color: var(--bg); }
  a { color: var(--green); text-decoration: none; border-bottom: 1px solid transparent; }
  a:hover, a:focus-visible { border-bottom-color: currentColor; }
  :focus-visible { outline: 1px dashed var(--green); outline-offset: 3px; }
  p { margin: 0 0 .7rem; }
  b { color: var(--bright); font-weight: 600; }
  kbd { font: inherit; color: var(--bright); background: var(--panel); padding: 0 .35em; border-radius: 3px; }
  .dim { color: var(--dim); }
  .hide { visibility: hidden; }

  /* welcome box */
  .welcome {
    display: inline-block;
    max-width: 100%;
    border: 1px solid var(--green);
    border-radius: 8px;
    padding: .7rem 1.4rem .8rem 1rem;
    margin-bottom: 1.6rem;
  }
  .welcome .mark { color: var(--green); }
  .welcome .title { color: var(--bright); }
  .welcome .sub { padding-left: 2ch; }

  #log { flex: 1; padding-bottom: 1.5rem; }

  /* conversation */
  .user {
    margin: 1.6rem 0 .8rem;
    padding: .25rem .8rem;
    background: var(--panel);
    color: var(--bright);
    border-radius: 4px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .user .gt { color: var(--dim); }
  .think { color: var(--amber); margin: .2rem 0; }
  .think .done { color: var(--dim); }
  .tool { margin-top: .5rem; }
  .tool .dot { color: var(--green); }
  .tool .arg { color: var(--dim); }
  .res { padding-left: 2ch; color: var(--dim); display: flex; gap: 1ch; }
  .res b { color: var(--fg); font-weight: 400; }
  .res .err { color: var(--red); }
  .todos { display: flex; flex-direction: column; }
  .todos .done { color: var(--dim); text-decoration: line-through; }
  .todos .now { color: var(--bright); }

  .say { position: relative; padding-left: 2ch; margin-top: .7rem; max-width: 92ch; }
  .say::before { content: "●"; position: absolute; left: 0; color: var(--fg); }
  .say.plain::before { content: none; }

  .sugg { display: flex; flex-direction: column; align-items: flex-start; gap: .1rem; margin-top: .4rem; }
  .sugg button, .perm button {
    font: inherit; color: var(--green); background: none; border: 0; padding: .1rem 0;
    cursor: pointer; text-align: left;
  }
  .sugg button:hover, .perm button:hover:not(:disabled) { color: var(--bright); }

  .posts { list-style: none; margin: .2rem 0 .8rem; padding: 0; }
  .posts li { display: grid; grid-template-columns: 11ch 1fr; column-gap: 2ch; padding: .15rem 0; }
  .posts .date { color: var(--dim); }
  .posts .desc { grid-column: 2; color: var(--dim); font-size: .92em; }

  .fname { color: var(--dim); border-bottom: 1px solid var(--faint); padding: .3rem 0 .3rem 1ch; margin-top: .3rem; }
  .ln { display: grid; grid-template-columns: 4ch 1fr; column-gap: 1.5ch; border-left: 1px solid var(--faint); }
  .ln .no { color: var(--line); text-align: right; user-select: none; }
  .ln .h { color: var(--bright); font-weight: 600; }
  .ln .em { color: var(--dim); font-style: italic; }
  .ln code { font: inherit; color: var(--amber); }
  .ln:last-of-type { margin-bottom: .8rem; }

  .proj { margin-top: .8rem; }
  .proj .lang { color: var(--amber); font-size: .85em; margin-left: 1ch; }
  .pd { margin: 0 0 0 2ch; }
  pre {
    margin: .5rem 0 0 2ch; padding: .6rem 1rem;
    border-left: 1px solid var(--faint);
    font: inherit; font-size: .88em; line-height: 1.35; overflow-x: auto;
  }

  .facts { display: grid; grid-template-columns: max-content 1fr; column-gap: 2ch; margin: .4rem 0 .8rem; }
  .facts dt { color: var(--amber); }
  .facts dd { margin: 0; }

  .cmds { display: grid; grid-template-columns: max-content 1fr; column-gap: 3ch; margin: .2rem 0 .8rem; }
  .cmds span:nth-child(odd) { color: var(--bright); }
  .cmds span:nth-child(even) { color: var(--dim); }

  /* permission prompt (easter egg) */
  .perm {
    margin: .8rem 0 0 2ch; padding: .7rem 1rem;
    border: 1px solid var(--amber); border-radius: 8px; max-width: 70ch;
  }
  .perm .ptitle { color: var(--amber); font-weight: 600; }
  .perm .pcmd { color: var(--bright); padding-left: 2ch; margin: .3rem 0 0; overflow-wrap: anywhere; }
  .perm .pdesc { color: var(--dim); padding-left: 2ch; margin-bottom: .6rem; }
  .perm .opts { display: flex; flex-direction: column; align-items: flex-start; }
  .perm button { color: var(--fg); }
  .perm button.sel { color: var(--amber); }
  .perm button:disabled { cursor: default; }
  .perm button:disabled:not(.sel) { color: var(--dim); }

  /* prompt + status line */
  #prompt {
    position: sticky; bottom: 0;
    background: var(--bg);
    padding: .4rem 0 1rem;
    box-shadow: 0 -1.2rem 1.2rem var(--bg);
  }
  #menu { margin: 0 0 .4rem 2ch; }
  #menu[hidden] { display: none; }
  #menu .row { display: grid; grid-template-columns: 14ch 1fr; color: var(--dim); }
  #menu .row b { color: var(--fg); font-weight: 400; }
  #menu .row.on b { color: var(--green); }
  #menu .keys { display: grid; grid-template-columns: repeat(2, minmax(0, 26ch)); color: var(--dim); column-gap: 3ch; }
  #menu .keys b { color: var(--fg); font-weight: 400; }
  .inbox {
    display: flex; align-items: center; gap: 1ch;
    border: 1px solid var(--line); border-radius: 8px;
    padding: .45rem .9rem; margin: 0;
  }
  .inbox:focus-within { border-color: var(--dim); }
  .inbox .gt { color: var(--bright); }
  #in {
    flex: 1; min-width: 0;
    font: inherit; color: var(--bright);
    background: none; border: 0; outline: none; padding: 0;
    caret-color: var(--green);
  }
  #in::placeholder { color: var(--dim); }
  .status {
    display: flex; flex-wrap: wrap; gap: .2rem 2ch;
    padding: .35rem 1ch 0; font-size: .85em; color: var(--dim);
  }
  .status .model { color: var(--green); }
  .status .warn { color: var(--amber); }
  .status .spacer { flex: 1; }

  @media (max-width: 600px) {
    body { font-size: 13.5px; padding: 1rem 1rem 0; }
    .posts li { grid-template-columns: 1fr; }
    .posts .desc { grid-column: 1; }
    .status .branch, .status .hint { display: none; }
    #menu .keys { grid-template-columns: 1fr; }
    .welcome { padding-right: 1rem; }
  }
</style>
</head>
<body>

<div class="welcome" role="banner">
  <div><span class="mark">»</span> <span class="title">Welcome to tthisk.com</span></div>
  <div class="sub dim">ask me about matthis, or type <span style="color:var(--fg)">/help</span></div>
  <div class="sub dim">cwd: ~/tthisk.com</div>
</div>

<main id="log" aria-live="polite"></main>

<div id="prompt">
  <div id="menu" hidden></div>
  <form class="inbox" id="form" autocomplete="off">
    <span class="gt" aria-hidden="true">&gt;</span>
    <input id="in" type="text" spellcheck="false" autocapitalize="off" aria-label="Ask the agent about matthis" placeholder='Try "show me the blog"'>
  </form>
  <div class="status" aria-label="Status line">
    <span class="model">◆ matthis-1.0</span>
    <span>~/tthisk.com</span>
    <span class="branch">⎇ main</span>
    <span id="ctx">context 3% used</span>
    <span class="spacer"></span>
    <span class="hint">? for shortcuts</span>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ---------- content (placeholder) ---------- */
  var POSTS = [
    { slug: 'tiny-lisp', date: '2026-10-28', mins: 9, title: 'Writing a tiny Lisp in a weekend',
      desc: 'A reader, an evaluator and a REPL in about four hundred lines.',
      body: ['Every programmer should write a Lisp once. Not because you will use it,',
             'but because it shows how little a language really needs.',
             '',
             '## The reader',
             'Turning `(+ 1 2)` into a list takes about forty lines. Most of them are',
             'about whitespace.'] },
    { slug: 'boring-technology', date: '2026-09-14', mins: 6, title: 'In defence of boring technology',
      desc: 'Postgres, cron and one server will take you further than you think.',
      body: ['The most reliable system I ever ran was a single box with Postgres,',
             'nginx and a crontab. It had no dashboard. It did not need one.',
             '',
             '## Innovation tokens',
             'You get about three per project. Spend them on the product, not on the',
             'message queue.'] },
    { slug: 'crdts-without-math', date: '2026-08-02', mins: 12, title: 'CRDTs explained without the math',
      desc: 'How collaborative editors stay in sync, with sticky notes instead of lattices.',
      body: ['Imagine two people editing the same wall of sticky notes, in different',
             'rooms, with no phone. How do they end up with the same wall?',
             '',
             '## Rule one: never erase',
             'Instead of removing a note, you mark it with a small `x`. Merging is',
             'then just putting everything on one wall.'] },
    { slug: 'dotfiles-ten-years', date: '2026-06-19', mins: 7, title: 'My dotfiles, ten years later',
      desc: 'A decade of aliases and the occasional regret.',
      body: ['My first commit to my dotfiles repo was a 900-line `.vimrc` copied from',
             'a stranger. Ten years later I understand almost half of it.',
             '',
             '## Aliases I still use',
             '`gs` for git status. That is the list.'] }
  ];

  var VERBS = ['thinking', 'pondering', 'grepping', 'bikeshedding', 'yak-shaving', 'rubber-ducking',
               'reticulating splines', 'reading the man page', 'overengineering', 'bisecting',
               'caffeinating', 'untangling', 'consulting the dotfiles', 'compiling an excuse'];

  var COMMANDS = [
    ['/blog', 'list recent posts'],
    ['/projects', 'what matthis is building'],
    ['/about', 'who is matthis'],
    ['/contact', 'how to get in touch'],
    ['/clear', 'clear the conversation'],
    ['/cost', 'show what this session cost'],
    ['/help', 'show commands']
  ];

  /* ---------- helpers ---------- */
  var log = document.getElementById('log');
  var input = document.getElementById('in');
  var form = document.getElementById('form');
  var menu = document.getElementById('menu');
  var ctxEl = document.getElementById('ctx');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  var busy = false, skip = false, pending = null;
  var ctx = 3, turns = 0, hist = [], hpos = 0, started = Date.now();

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fast() { return reduce.matches || skip; }
  function sleep(ms) {
    if (fast()) return Promise.resolve();
    return new Promise(function (resolve) {
      var s = Date.now();
      (function tick() {
        if (skip || Date.now() - s >= ms) resolve(); else setTimeout(tick, 25);
      })();
    });
  }
  function scroll() { window.scrollTo(0, document.documentElement.scrollHeight); }
  function add(cls, html) {
    var d = document.createElement('div');
    d.className = cls;
    d.innerHTML = html;
    log.appendChild(d);
    scroll();
    return d;
  }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  /* ---------- agent primitives ---------- */
  function user(text) { add('user', '<span class="gt">&gt;</span> ' + esc(text)); }

  function think(min, max) {
    if (reduce.matches) return Promise.resolve();
    min = min || 600; max = max || 1400;
    var verb = pick(VERBS);
    var frames = ['⠋', '⠙', '⠹', '⠸', '⠼', '⠴', '⠦', '⠧', '⠇', '⠏'];
    var d = add('think', '');
    var start = Date.now(), i = 0;
    function paint() {
      var s = Math.floor((Date.now() - start) / 1000);
      d.innerHTML = frames[i++ % frames.length] + ' ' + verb + '… <span class="dim">(' + s + 's · esc to interrupt)</span>';
    }
    paint();
    var iv = setInterval(paint, 90);
    return sleep(min + Math.random() * (max - min)).then(function () {
      clearInterval(iv);
      var secs = Math.max(1, Math.round((Date.now() - start) / 1000));
      d.innerHTML = '<span class="done">✓ ' + verb + ' · ' + secs + 's</span>';
    });
  }

  function tool(name, arg, result) {
    add('tool', '<span class="dot">●</span> <b>' + name + '</b>' + (arg ? '(<span class="arg">' + arg + '</span>)' : ''));
    return sleep(320).then(function () {
      add('res', '<span>⎿</span><span>' + result + '</span>');
      return sleep(160);
    });
  }

  // Appends an answer and reveals its top-level children one by one.
  function say(html, cls) {
    var d = add('say' + (cls ? ' ' + cls : ''), html);
    var kids = Array.prototype.slice.call(d.children);
    if (fast() || kids.length < 2) return Promise.resolve(d);
    kids.forEach(function (k) { k.classList.add('hide'); });
    return kids.reduce(function (p, k) {
      return p.then(function () { return sleep(55); }).then(function () { k.classList.remove('hide'); scroll(); });
    }, Promise.resolve()).then(function () { return d; });
  }

  function md(line) {
    var s = esc(line).replace(/`([^`]+)`/g, '<code>$1</code>');
    if (/^#{1,2} /.test(line)) return '<span class="h">' + s + '</span>';
    if (/^_.*_$/.test(line)) return '<span class="em">' + s.slice(1, -1) + '</span>';
    return s || '&nbsp;';
  }

  function status() {
    ctxEl.textContent = 'context ' + ctx + '% used' + (ctx >= 80 ? ' · /clear to free up' : '');
    ctxEl.className = ctx >= 80 ? 'warn' : '';
  }

  /* ---------- answers ---------- */
  function intro() {
    add('say',
      '<p>Hi. I’m the agent that looks after matthis’s home page. matthis is a software engineer ' +
      'who writes about systems, tooling, and the craft of making things for computers.</p>' +
      '<p>What would you like to see?</p>' +
      '<div class="sugg">' +
      [['show me the blog'], ['what is matthis building?'], ['who is matthis?'], ['how do I get in touch?']]
        .map(function (s) { return '<button type="button" data-cmd="' + s[0] + '">› ' + s[0] + '</button>'; }).join('') +
      '</div>');
  }

  function blog() {
    return think().then(function () {
      return tool('Read', 'blog/index.md', 'Read <b>' + POSTS.length + '</b> posts');
    }).then(function () {
      return say(
        '<p>Here’s what matthis has written lately, newest first:</p>' +
        '<ul class="posts">' + POSTS.map(function (p) {
          return '<li><span class="date">' + p.date + '</span><a href="#" data-cmd="read ' + p.slug + '">' + p.title +
                 '</a><span class="desc">' + p.desc + '</span></li>';
        }).join('') + '</ul>' +
        '<p class="dim">Click a title, or type <kbd>read 2</kbd>.</p>');
    });
  }

  function read(p) {
    var lines = ['# ' + p.title, '_' + p.date + ' · ' + p.mins + ' min read_', ''].concat(p.body);
    return think(400, 900).then(function () {
      return tool('Read', 'blog/' + p.slug + '.md', 'Read <b>' + lines.length + '</b> lines');
    }).then(function () {
      return say(
        '<div class="fname">blog/' + p.slug + '.md</div>' +
        lines.map(function (l, n) {
          return '<div class="ln"><span class="no">' + (n + 1) + '</span><span>' + md(l) + '</span></div>';
        }).join('') +
        '<p class="dim">That’s the opening. The rest isn’t written yet (everything here is placeholder). ' +
        '<a href="#" data-cmd="/blog">Back to the list</a>.</p>', 'plain');
    });
  }

  function projects() {
    return think().then(function () {
      return tool('Bash', 'ls ~/projects', '<b>3</b> entries');
    }).then(function () {
      return tool('Update Todos', '',
        '<span class="todos"><span class="done">☒ kvlite: storage engine, compaction, crash recovery</span>' +
        '<span class="done">☒ termplot: braille charts from stdin</span>' +
        '<span class="now">☐ tthisk.com: pick one of these home page designs</span></span>');
    }).then(function () {
      return say(
        '<p>Three things on the bench right now:</p>' +
        '<div class="proj"><a href="https://github.com/matthisk">kvlite/</a><span class="lang">rust</span></div>' +
        '<p class="pd">An embeddable key-value store built on a log-structured merge tree. Written to understand how storage engines really work.</p>' +
        '<div class="proj"><a href="https://github.com/matthisk">termplot/</a><span class="lang">go</span></div>' +
        '<p class="pd">Charts in the terminal, drawn with Braille characters.</p>' +
        '<pre aria-label="Example termplot output: a sine wave"><span class="dim">$</span> seq 1 20 | awk \'{print sin($1/3)}\' | termplot\n' +
        ' 1 |  ⢀⡠⠤⢄          ⡠⠤⢄⡀\n   | ⡔⠁   ⠑⡄       ⡔⠁   ⠈⢢\n 0 |⠎      ⠘⡄    ⢠⠃      ⠱\n   |        ⠈⢆  ⡰⠁\n-1 |          ⠑⠊</pre>' +
        '<div class="proj"><a href="#">tthisk.com/</a><span class="lang">html</span></div>' +
        '<p class="pd">This site. You’re talking to it.</p>');
    });
  }

  function about() {
    return think().then(function () {
      return tool('Read', 'about.txt', 'Read <b>9</b> lines');
    }).then(function () {
      return say(
        '<p>matthis likes small, sharp tools, fast feedback loops, and code that is pleasant to read a year ' +
        'after it was written. When he’s not building products he’s usually building tools nobody asked for, ' +
        'or writing about why he built them.</p>' +
        '<dl class="facts"><dt>languages</dt><dd>Rust, TypeScript, Go</dd>' +
        '<dt>reading</dt><dd>about storage engines</dd>' +
        '<dt>editor</dt><dd>whichever one is open</dd>' +
        '<dt>shell</dt><dd>this one, apparently</dd></dl>');
    });
  }

  function contact() {
    return think(400, 900).then(function () {
      return tool('Grep', '"@", about.txt', 'Found <b>1</b> match');
    }).then(function () {
      return say(
        '<p>Email is best: <a href="mailto:webmaster@tthisk.com">webmaster@tthisk.com</a></p>' +
        '<p>Code lives at <a href="https://github.com/matthisk">github.com/matthisk</a>, and new posts are in the <a href="#">rss feed</a>.</p>');
    });
  }

  function help() {
    return say(
      '<p>Ask in plain words (“what has he written?”) or use a command:</p>' +
      '<div class="cmds">' + COMMANDS.map(function (c) { return '<span>' + c[0] + '</span><span>' + c[1] + '</span>'; }).join('') +
      '<span>read 2</span><span>open the second post</span></div>' +
      '<p class="dim">Press <kbd>?</kbd> in an empty prompt for keyboard shortcuts.</p>');
  }

  function cost() {
    var mins = Math.max(1, Math.round((Date.now() - started) / 60000));
    var coffees = Math.max(1, Math.ceil(turns / 3));
    return say(
      '<dl class="facts">' +
      '<dt>Total cost</dt><dd>$0.00, paid in ' + coffees + ' coffee' + (coffees > 1 ? 's' : '') + ' and one stroopwafel</dd>' +
      '<dt>Wall time</dt><dd>' + mins + ' min of your life you won’t get back</dd>' +
      '<dt>Turns</dt><dd>' + turns + '</dd>' +
      '<dt>Tokens</dt><dd>roughly one tiny Lisp interpreter’s worth</dd></dl>', 'plain');
  }

  // Easter egg: a permission prompt for destructive commands.
  function permission(cmd) {
    return think(500, 900).then(function () {
      var box = add('perm',
        '<div class="ptitle">Bash command</div>' +
        '<div class="pcmd">' + esc(cmd) + '</div>' +
        '<div class="pdesc">Permanently delete the entire website</div>' +
        '<p>Do you want to proceed?</p>' +
        '<div class="opts"><button type="button" class="sel" data-opt="1">❯ 1. Yes</button>' +
        '<button type="button" data-opt="2">&nbsp; 2. No, and tell the agent what to do differently <span class="dim">(esc)</span></button></div>');
      return new Promise(function (resolve) { pending = resolve; }).then(function (choice) {
        pending = null;
        box.querySelectorAll('button').forEach(function (b) {
          b.disabled = true;
          b.classList.toggle('sel', b.getAttribute('data-opt') === choice);
        });
        return choice;
      });
    }).then(function (choice) {
      if (choice === '1') {
        return think(500, 1000).then(function () {
          return tool('Bash', esc(cmd.length > 40 ? cmd.slice(0, 40) + '…' : cmd), '<span class="err">Refused by agent</span>');
        }).then(function () {
          return say('<p>You said yes. I said no. That’s what makes this a healthy relationship.</p>' +
                     '<p class="dim">The blog has survived worse. Besides, everything here is placeholder content; ' +
                     'you’d only be deleting lorem ipsum with opinions.</p>');
        });
      }
      return say('<p>Good call. Let’s pretend that never happened.</p>');
    });
  }

  function sudo(cmd) {
    return think(300, 700).then(function () {
      return tool('Bash', esc(cmd.length > 40 ? cmd.slice(0, 40) + '…' : cmd),
        '<span class="err">visitor is not in the sudoers file. This incident will be reported.</span>');
    }).then(function () { return say('<p>Nice try.</p>'); });
  }

  function sandwich(withSudo) {
    return think(400, 800).then(function () {
      return say(withSudo ? '<p>Okay.</p><pre>  _______\n /       \\\n|~~~~~~~~~|\n|#########|\n \\_______/</pre>'
                          : '<p>What? Make it yourself.</p>');
    });
  }

  function fallback(text) {
    return think(400, 900).then(function () {
      return say('<p>I only know about matthis, I’m afraid. I can show you the <a href="#" data-cmd="/blog">blog</a>, ' +
                 '<a href="#" data-cmd="/projects">projects</a>, <a href="#" data-cmd="/about">about</a> or ' +
                 '<a href="#" data-cmd="/contact">contact</a>. Type <kbd>/help</kbd> for more.</p>');
    });
  }

  function clearLog() {
    log.innerHTML = '';
    ctx = 3; status();
    intro();
    window.scrollTo(0, 0);
  }

  /* ---------- routing ---------- */
  function findPost(arg) {
    var n = parseInt(arg, 10);
    if (n >= 1 && n <= POSTS.length) return POSTS[n - 1];
    arg = arg.replace(/^blog\//, '').replace(/\.md$/, '');
    for (var i = 0; i < POSTS.length; i++) if (POSTS[i].slug === arg) return POSTS[i];
    return null;
  }

  function route(t) {
    var l = t.toLowerCase();
    var m;
    if (l[0] === '/') {
      var c = l.slice(1).split(/\s+/)[0];
      var map = { blog: blog, posts: blog, projects: projects, about: about, contact: contact, help: help, cost: cost };
      if (map[c]) return map[c]();
      if (c === 'exit' || c === 'quit') return say('<p>There is no exit. Only more blog posts.</p>');
      return say('<p>Unknown command <b>' + esc(t.split(/\s+/)[0]) + '</b>. Try <kbd>/help</kbd>.</p>');
    }
    if (/^:(q|wq|q!|x)$/.test(l)) return say('<p>Wrong program. But I respect the reflex.</p>');
    if ((m = l.match(/^(?:read|open|cat)\s+(\S+)/)) && findPost(m[1])) return read(findPost(m[1]));
    if (/\brm\s+-[a-z]*r|\bdelete\b|\bdrop\s+table|\bmkfs\b|\bwipe\b/.test(l))
      return permission(/\brm\s/.test(l) ? t.replace(/^sudo\s+/i, '') : 'rm -rf /');
    if (/sandwich/.test(l)) return sandwich(/\bsudo\b/.test(l));
    if (/^sudo\b/.test(l)) return sudo(t);
    if (/blog|post|writ|article|read|lately/.test(l)) return blog();
    if (/project|build|work|code|bench|making/.test(l)) return projects();
    if (/contact|email|mail|reach|touch|hire|github/.test(l)) return contact();
    if (/about|who|yourself|matthis|bio/.test(l)) return about();
    if (/help|command|what can/.test(l)) return help();
    if (/^(hi|hello|hey|yo|hoi)\b/.test(l)) return say('<p>Hello! Ask me about matthis, or type <kbd>/help</kbd>.</p>');
    return fallback(t);
  }

  function submit(text) {
    var t = text.trim();
    if (!t || busy) return;
    hist.push(t); hpos = hist.length;
    hideMenu();
    if (/^\/clear\b/i.test(t)) { clearLog(); return; }
    busy = true; skip = false;
    user(t);
    Promise.resolve().then(function () { return route(t); }).catch(function (e) { console.error(e); }).then(function () {
      busy = false; skip = false; turns++;
      ctx = Math.min(97, ctx + 4 + Math.floor(Math.random() * 6));
      status(); scroll();
    });
  }

  /* ---------- menu: slash commands and shortcuts ---------- */
  function hideMenu() { menu.hidden = true; menu.innerHTML = ''; menu.dataset.kind = ''; }
  function showShortcuts() {
    menu.dataset.kind = 'keys';
    menu.innerHTML = '<div class="keys">' +
      '<span><b>/</b> for commands</span><span><b>↑ ↓</b> history</span>' +
      '<span><b>tab</b> to complete</span><span><b>esc</b> to interrupt</span>' +
      '<span><b>ctrl+l</b> to clear</span><span><b>?</b> to close this</span></div>';
    menu.hidden = false;
  }
  function slashMatches(v) {
    return COMMANDS.filter(function (c) { return c[0].indexOf(v.toLowerCase()) === 0; });
  }
  function showSlash(v) {
    var list = slashMatches(v);
    if (!list.length || /\s/.test(v)) { hideMenu(); return; }
    menu.dataset.kind = 'slash';
    menu.innerHTML = list.map(function (c, i) {
      return '<div class="row' + (i === 0 ? ' on' : '') + '"><b>' + c[0] + '</b><span>' + c[1] + '</span></div>';
    }).join('');
    menu.hidden = false;
  }

  /* ---------- events ---------- */
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (pending) { pending('1'); return; }
    var v = input.value;
    if (busy) return;
    input.value = '';
    submit(v);
  });

  input.addEventListener('input', function () {
    if (input.value[0] === '/') showSlash(input.value);
    else if (menu.dataset.kind === 'slash') hideMenu();
  });

  input.addEventListener('keydown', function (e) {
    if (pending) {
      if (e.key === '1' || e.key === '2') { e.preventDefault(); pending(e.key); return; }
      if (e.key === 'Escape') { e.preventDefault(); pending('2'); return; }
    }
    if (e.key === '?' && input.value === '') {
      e.preventDefault();
      if (menu.dataset.kind === 'keys') hideMenu(); else showShortcuts();
    } else if (e.key === 'Escape') {
      if (busy) skip = true; else hideMenu();
    } else if (e.key === 'Tab' && input.value[0] === '/') {
      var list = slashMatches(input.value);
      if (list.length) { e.preventDefault(); input.value = list[0][0]; showSlash(input.value); }
    } else if (e.key === 'ArrowUp' && hist.length) {
      e.preventDefault(); hpos = Math.max(0, hpos - 1); input.value = hist[hpos];
    } else if (e.key === 'ArrowDown' && hist.length) {
      e.preventDefault(); hpos = Math.min(hist.length, hpos + 1); input.value = hist[hpos] || '';
    } else if (e.key.toLowerCase() === 'l' && e.ctrlKey) {
      e.preventDefault(); if (!busy) clearLog();
    }
  });

  document.addEventListener('click', function (e) {
    var opt = e.target.closest('[data-opt]');
    if (opt && pending) { pending(opt.getAttribute('data-opt')); return; }
    var cmd = e.target.closest('[data-cmd]');
    if (cmd) { e.preventDefault(); submit(cmd.getAttribute('data-cmd')); return; }
    if (!e.target.closest('a, button, input') && !String(window.getSelection())) input.focus({ preventScroll: true });
  });

  // Typing anywhere goes to the prompt.
  document.addEventListener('keydown', function (e) {
    if (document.activeElement === input || e.metaKey || e.ctrlKey || e.altKey) return;
    if (pending && (e.key === '1' || e.key === '2' || e.key === 'Escape')) {
      e.preventDefault(); pending(e.key === 'Escape' ? '2' : e.key); return;
    }
    if (e.key === 'Escape' && busy) { skip = true; return; }
    if (e.key.length === 1) input.focus();
  });

  /* ---------- start ---------- */
  intro();
  status();
  var start = { '#blog': '/blog', '#projects': '/projects', '#about': '/about', '#contact': '/contact' }[location.hash];
  if (start) submit(start);
  if (window.matchMedia('(pointer: fine)').matches) input.focus({ preventScroll: true });
})();
</script>
</body>
</html>
