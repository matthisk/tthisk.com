<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>home.md - nvim ~ tthisk.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<!--
  Design 09: the site as an editor session. One buffer at a time,
  a tabline on top, a status line and a command line at the bottom.
  Every link is still a link: keyboard is optional, clicking works.
-->
<style>
  :root {
    --bg: #0f1114;
    --panel: #15181d;
    --panel-2: #1c2027;
    --cursorline: #181c22;
    --fg: #c8ccd2;
    --bright: #eceff3;
    --dim: #6c727d;
    --faint: #2a2e35;
    --green: #9ece8a;
    --amber: #e2c08d;
    --blue: #8cb4e8;
    --purple: #c3a6e0;
    --red: #e48a8a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body {
    display: grid;
    grid-template-rows: auto 1fr auto auto;
    height: 100vh; height: 100dvh;
    overflow: hidden;
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 15px;
    line-height: 1.65;
    color: var(--fg);
    font-variant-ligatures: none;
    -webkit-text-size-adjust: 100%;
  }
  ::selection { background: #2e3a4a; color: var(--bright); }
  a { color: var(--blue); text-decoration: underline; text-decoration-color: #8cb4e855; text-underline-offset: 3px; }
  a:hover { text-decoration-color: currentColor; }
  a:focus-visible { outline: 1px dashed var(--blue); outline-offset: 2px; }

  /* tabline */
  #tabs {
    display: flex; align-items: stretch;
    background: var(--panel);
    white-space: nowrap; overflow-x: auto; scrollbar-width: none;
  }
  #tabs::-webkit-scrollbar { display: none; }
  #tabs a {
    color: var(--dim); text-decoration: none;
    padding: .15rem 1.1ch;
    border-right: 1px solid var(--bg);
  }
  #tabs a .n { color: var(--faint); margin-right: .6ch; }
  #tabs a:hover { color: var(--fg); }
  #tabs a.on { background: var(--bg); color: var(--bright); }
  #tabs a.on .n { color: var(--green); }
  #tabs .fill { flex: 1; }
  #tabs .host { color: var(--dim); padding: .15rem 1.2ch; }

  /* buffer */
  #buf { overflow-y: auto; overflow-x: hidden; padding-top: .2rem; outline: none; }
  .row { display: flex; min-height: 1.65em; }
  .row.act { cursor: pointer; }
  .row.cl { background: var(--cursorline); }
  .nr {
    flex: none; width: 6ch; padding-right: 1.5ch;
    text-align: right; color: var(--faint); user-select: none;
  }
  .row.cl .nr { color: var(--amber); text-align: left; padding-left: 1ch; }
  body.nonu .nr { display: none; }
  body.nonu .tx { padding-left: 1ch; }
  .tx { flex: 1; min-width: 0; max-width: 84ch; white-space: pre-wrap; overflow-wrap: anywhere; padding-right: 1ch; }
  .tilde .tx { color: #3a4a66; padding-left: 1ch; }

  /* syntax */
  .mk  { color: var(--dim); }
  .h1  { color: var(--green); font-weight: 600; }
  .h2  { color: var(--amber); font-weight: 600; }
  .qt  { color: var(--green); }
  .q   { font-style: italic; color: var(--bright); }
  .url { color: var(--dim); }
  .dim { color: var(--dim); }
  .cm  { color: var(--dim); font-style: italic; }
  .kw  { color: var(--amber); }
  .str { color: var(--green); }
  .num { color: var(--purple); }
  .fn  { color: var(--blue); }
  .dir { color: var(--blue); font-weight: 600; }
  .hid { color: var(--purple); }
  .tag { color: var(--purple); }
  .hd  { color: var(--amber); font-weight: 600; }
  .err { color: var(--red); }
  .code { color: var(--fg); }
  .col-date { display: inline-block; width: 12ch; color: var(--dim); }
  .col-file { display: inline-block; width: 26ch; color: var(--dim); }
  .col-lang { display: inline-block; width: 7ch; color: var(--amber); }
  .col-name { display: inline-block; width: 14ch; }

  /* status line */
  #status { display: flex; background: var(--panel); white-space: nowrap; overflow: hidden; }
  #status span { padding: 0 1.2ch; }
  #status .mode, #status .pos { background: var(--green); color: var(--bg); font-weight: 600; }
  body.cmdmode #status .mode, body.cmdmode #status .pos { background: var(--amber); }
  #status .seg2 { background: var(--panel-2); color: var(--fg); }
  #status .seg { color: var(--dim); }
  #status .fname { color: var(--bright); }
  #status .fill { flex: 1; padding: 0; }

  /* command line */
  #cmd { display: flex; align-items: center; min-height: 1.65em; padding: 0 1ch; white-space: nowrap; overflow: hidden; cursor: text; }
  #msg { flex: 1; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }
  #msg.hint { color: var(--dim); }
  #msg.error { color: var(--red); }
  #prompt { display: none; }
  #cmdin {
    display: none; flex: 1; min-width: 0;
    background: transparent; border: 0; outline: none; padding: 0;
    font: inherit; color: var(--bright); caret-color: var(--bright);
  }
  body.cmdmode #msg { display: none; }
  body.cmdmode #prompt, body.cmdmode #cmdin { display: block; }
  #showcmd { color: var(--dim); margin-left: 2ch; }
  .touch { display: none; }
  @media (hover: none) { .touch { display: inline; } .keys { display: none; } }

  /* the exit screen */
  #exit {
    position: fixed; inset: 0; z-index: 10;
    background: #000; color: var(--fg);
    padding: 1.2rem 1.4rem; white-space: pre-wrap;
    animation: fade .5s ease-out;
  }
  #exit[hidden] { display: none; }
  #exit .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    #exit, #exit .blink { animation: none; }
  }

  @media (max-width: 600px) {
    body { font-size: 14px; }
    .nr { width: 4ch; padding-right: 1ch; }
    .row.cl .nr { padding-left: .5ch; }
    .tail, .col-file, .wide { display: none; }
    .col-date { width: 11ch; }
    .col-name { width: 12ch; }
    #tabs .host { display: none; }
  }
</style>
</head>
<body>

<nav id="tabs" aria-label="Buffers"></nav>
<main id="buf" tabindex="-1" aria-live="polite"></main>
<div id="status" aria-hidden="true"></div>
<div id="cmd">
  <span id="msg" class="hint"></span>
  <span id="prompt">:</span>
  <input id="cmdin" type="text" aria-label="Command" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
  <span id="showcmd" aria-hidden="true"></span>
</div>
<div id="exit" hidden role="alertdialog" aria-label="Editor closed"></div>

<noscript>
  <p style="padding:1rem">matthis &mdash; software engineer.
  <a href="https://github.com/matthisk">github</a> &middot;
  <a href="mailto:webmaster@tthisk.com">webmaster@tthisk.com</a></p>
</noscript>

<script>
"use strict";

/* ---------- content (placeholder) ---------- */

var POSTS = [
  { slug: "tiny-lisp", title: "Writing a tiny Lisp in a weekend", date: "2026-10-28",
    desc: "A reader, an evaluator and a REPL in about four hundred lines.", tags: ["lisp", "interpreters"],
    code: { lang: "lisp", lines: [
      "(define (eval expr env)",
      "  (cond ((symbol? expr) (lookup expr env))",
      "        ((atom? expr) expr)",
      "        (else (apply (eval (car expr) env)",
      "                     (map (lambda (e) (eval e env))",
      "                          (cdr expr))))))"
    ] } },
  { slug: "boring-technology", title: "In defence of boring technology", date: "2026-09-14",
    desc: "Postgres, cron and one server will take you further than you think.", tags: ["architecture"] },
  { slug: "crdts-without-math", title: "CRDTs explained without the math", date: "2026-08-02",
    desc: "How collaborative editors stay in sync, with sticky notes instead of lattices.", tags: ["distributed-systems"] },
  { slug: "dotfiles-ten-years", title: "My dotfiles, ten years later", date: "2026-06-19",
    desc: "A decade of aliases and the occasional regret.", tags: ["tools"] }
];

var PROJECTS = [
  { slug: "kvlite", lang: "rust", short: "embeddable key-value store on an LSM tree",
    body: "An embeddable key-value store built on a log-structured merge tree. Written to understand how storage engines really work: memtables, SSTables, compaction and the occasional bloom filter." },
  { slug: "termplot", lang: "go", short: "charts in the terminal, drawn in braille",
    body: "Charts in the terminal, drawn with Braille characters. Pipe numbers in, get a plot out.",
    code: { lang: "sh", lines: [
      "$ seq 1 20 | awk '{print sin($1/3)}' | termplot",
      " 1 |  ⢀⡠⠤⢄          ⡠⠤⢄⡀",
      "   | ⡔⠁   ⠑⡄       ⡔⠁   ⠈⢢",
      " 0 |⠎      ⠘⡄    ⢠⠃      ⠱",
      "   |        ⠈⢆  ⡰⠁",
      "-1 |          ⠑⠊"
    ] } },
  { slug: "tthisk.com", lang: "html", short: "this site",
    body: "This site. One HTML file pretending to be a text editor. No build step, no framework, no dependencies beyond a font." }
];

var EMAIL = "webmaster@tthisk.com";
var GITHUB = "https://github.com/matthisk";

/* ---------- helpers ---------- */

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function sp(cls, html) { return '<span class="' + cls + '">' + html + "</span>"; }
function L(h, go) { return { h: h || "", go: go || null }; }
var BLANK = L("");
function mdLink(text, path, href) {
  return sp("mk", "[") + '<a href="' + esc(href) + '">' + esc(text) + "</a>" + sp("mk", "]") +
    sp("tail", sp("mk", "(") + sp("url", esc(path)) + sp("mk", ")"));
}
function h1(t) { return L(sp("mk", "# ") + sp("h1", esc(t))); }
function h2(t) { return L(sp("mk", "## ") + sp("h2", esc(t))); }
function fence(code) {
  var out = [L(sp("mk", "```" + code.lang))];
  code.lines.forEach(function (c) { out.push(L(sp("code", esc(c)))); });
  out.push(L(sp("mk", "```")));
  return out;
}

/* ---------- state ---------- */

var S = {
  route: "/", buf: null, cur: {}, hidden: false,
  nu: true, rnu: true, quits: 0, pending: "", firstLoad: true
};

/* ---------- buffers ---------- */

function bufHome() {
  var l = [
    h1("matthis"),
    BLANK,
    L(sp("qt", "> ") + sp("q", "software engineer. I write about systems, tooling, and the craft of making things for computers.")),
    BLANK,
    h2("recent writing"),
    BLANK
  ];
  POSTS.slice(0, 2).forEach(function (p) {
    var href = "#/blog/" + p.slug;
    l.push(L(sp("mk", "- ") + mdLink(p.title, "blog/" + p.slug + ".md", href) + " " + sp("dim wide", p.date), href));
  });
  l.push(L(sp("mk", "- ") + mdLink("all posts", "blog/", "#/blog"), "#/blog"));
  l.push(BLANK, h2("around here"), BLANK);
  l.push(L(sp("mk", "- ") + mdLink("projects", "projects/", "#/projects") + sp("dim", " things I built to understand things"), "#/projects"));
  l.push(L(sp("mk", "- ") + mdLink("about", "about.md", "#/about") + sp("dim", " who, what, which editor"), "#/about"));
  l.push(BLANK, h2("elsewhere"), BLANK);
  l.push(L(sp("mk", "- ") + mdLink("github", "github.com/matthisk", GITHUB), GITHUB));
  l.push(L(sp("mk", "- ") + mdLink("email", EMAIL, "mailto:" + EMAIL), "mailto:" + EMAIL));
  l.push(L(sp("mk", "- ") + mdLink("rss", "feed.xml", "#"), null));
  l.push(BLANK);
  l.push(L(sp("cm", "&lt;!-- press : for commands, ? for help, or just click a link --&gt;")));
  return { name: "home.md", ft: "markdown", lines: l, start: 0 };
}

function bufBlog() {
  var l = [
    L(sp("cm", '" ~/blog/  ' + POSTS.length + " files, newest first")),
    L(sp("cm", '" g. toggles hidden files'), "toggle:hidden"),
    L(sp("dir", "../"), "#/")
  ];
  if (S.hidden) l.push(L(sp("col-date", "2016-11-10") + sp("col-file", "") + '<a class="hid" href="#/blog/.secret">.secret</a>', "#/blog/.secret"));
  POSTS.forEach(function (p) {
    var href = "#/blog/" + p.slug;
    l.push(L(sp("col-date", p.date) + sp("col-file", esc(p.slug) + ".md") + '<a href="' + href + '">' + esc(p.title) + "</a>", href));
  });
  return { name: "blog/", ft: "directory", lines: l, start: 3 + (S.hidden ? 1 : 0) };
}

function bufPost(p) {
  var l = [
    L(sp("mk", "---")),
    L(sp("kw", "title") + sp("mk", ": ") + sp("str", esc(p.title))),
    L(sp("kw", "date") + sp("mk", ": ") + sp("num", p.date)),
    L(sp("kw", "tags") + sp("mk", ": [") + p.tags.map(function (t) { return sp("str", esc(t)); }).join(sp("mk", ", ")) + sp("mk", "]")),
    L(sp("mk", "---")),
    BLANK,
    h1(p.title),
    BLANK,
    L(sp("q", esc(p.desc))),
    BLANK,
    L("This is a placeholder. The full post will live here once the site is built. Until then, imagine around two thousand careful words and one diagram that took longer to make than the words.")
  ];
  if (p.code) { l.push(BLANK); l = l.concat(fence(p.code)); }
  l.push(BLANK, L(mdLink("back to blog/", "blog/", "#/blog") + sp("dim wide", "  or press -"), "#/blog"));
  return { name: "blog/" + p.slug + ".md", ft: "markdown", lines: l, start: 6 };
}

function bufSecret() {
  return { name: "blog/.secret", ft: "text", start: 0, lines: [
    L(sp("cm", "# you found the hidden file. not many people press g.")),
    BLANK,
    L("After ten years of dotfiles, this is the config I actually use:"),
    BLANK,
    L(sp("kw", "set") + " number"),
    L(sp("kw", "set") + " relativenumber"),
    L(sp("kw", "set") + " clipboard" + sp("mk", "=") + sp("str", "unnamedplus")),
    L(sp("kw", "nnoremap") + " ; :"),
    BLANK,
    L("Everything else was procrastination."),
    BLANK,
    L(sp("cm", "# 1 of 2 secrets. for the other one, try leaving."))
  ] };
}

function bufProjects() {
  var l = [
    L(sp("cm", '" ~/projects/  ' + PROJECTS.length + " directories")),
    L(sp("dir", "../"), "#/")
  ];
  PROJECTS.forEach(function (p) {
    var href = "#/projects/" + p.slug;
    l.push(L(sp("col-name", '<a class="dir" href="' + href + '">' + esc(p.slug) + "/</a>") + sp("col-lang", p.lang) + sp("dim", esc(p.short)), href));
  });
  return { name: "projects/", ft: "directory", lines: l, start: 2 };
}

function bufProject(p) {
  var l = [
    h1(p.slug),
    BLANK,
    L(sp("mk", "`") + sp("kw", p.lang) + sp("mk", "`") + " " + mdLink("source", "github.com/matthisk/" + p.slug, GITHUB + "/" + p.slug), GITHUB + "/" + p.slug),
    BLANK,
    L(esc(p.body))
  ];
  if (p.code) { l.push(BLANK); l = l.concat(fence(p.code)); }
  l.push(BLANK, h2("status"), BLANK, L("Work in progress. This README is a placeholder."));
  l.push(BLANK, L(mdLink("back to projects/", "projects/", "#/projects") + sp("dim wide", "  or press -"), "#/projects"));
  return { name: "projects/" + p.slug + "/README.md", ft: "markdown", lines: l, start: 0 };
}

function bufAbout() {
  var l = [
    h1("about"),
    BLANK,
    L("I like small, sharp tools, fast feedback loops, and code that is pleasant to read a year after it was written. When I'm not building products I'm usually building tools nobody asked for, or writing about why I built them."),
    BLANK,
    L(sp("mk", "```lua")),
    L(sp("cm", "-- facts.lua")),
    L(sp("kw", "return") + " " + sp("mk", "{")),
    L("  languages " + sp("mk", "= {") + " " + [ "rust", "typescript", "go" ].map(function (s) { return sp("str", '"' + s + '"'); }).join(sp("mk", ", ")) + " " + sp("mk", "},")),
    L("  reading   " + sp("mk", "=") + " " + sp("str", '"about storage engines"') + sp("mk", ",")),
    L("  editor    " + sp("mk", "=") + " " + sp("str", '"whichever one is open"') + sp("mk", ",") + " " + sp("cm wide", "-- (this one, today)")),
    L("  contact   " + sp("mk", "=") + " " + sp("str", '"<a href="mailto:' + EMAIL + '">' + EMAIL + '</a>"') + sp("mk", ","), "mailto:" + EMAIL),
    L("  github    " + sp("mk", "=") + " " + sp("str", '"<a href="' + GITHUB + '">github.com/matthisk</a>"') + sp("mk", ","), GITHUB),
    L(sp("mk", "}")),
    L(sp("mk", "```"))
  ];
  return { name: "about.md", ft: "markdown", lines: l, start: 0 };
}

function bufHelp() {
  function row(k, d) { return L("  " + sp("kw", esc(k)) + " ".repeat(Math.max(1, 20 - k.length)) + esc(d)); }
  function hd(t, tag) { return L(sp("hd", t) + "  " + sp("tag", "*" + tag + "*")); }
  return { name: "help.txt", ft: "help", start: 0, lines: [
    L(sp("tag", "*help.txt*") + "   tthisk.com, as an editor"),
    BLANK,
    L("Everything here is clickable. The keys are for people who would rather not reach for the mouse."),
    BLANK,
    hd("MOVING AROUND", "nav"),
    row("j k  or arrows", "move the cursor line"),
    row("gg  G", "first / last line"),
    row("Enter  l  click", "open the link on the cursor line"),
    row("-  h", "go up a directory"),
    row("1-4  gt  gT", "switch buffer"),
    row("?", "this help"),
    BLANK,
    hd("COMMANDS", "commands"),
    row(":e {name}", "open home, blog, projects, about, or a post"),
    row(":bn  :bp", "next / previous buffer"),
    row(":{n}", "jump to line n"),
    row(":set nonu  nornu", "line numbers off / not relative"),
    row(":q", "quit (good luck)"),
    BLANK,
    L(mdLink("back home", "home.md", "#/"), "#/")
  ] };
}

function bufMissing(path) {
  return { name: path, ft: "", start: 1, lines: [
    L(sp("err", "E484: Can't open file " + esc(path))),
    L(mdLink("back home", "home.md", "#/"), "#/")
  ] };
}

function resolve(route) {
  var parts = route.replace(/^\/+|\/+$/g, "").split("/");
  var a = parts[0] || "", b = parts.slice(1).join("/");
  var buf;
  if (!a) buf = bufHome();
  else if (a === "blog" && !b) buf = bufBlog();
  else if (a === "blog" && b === ".secret") buf = bufSecret();
  else if (a === "blog") { var p = POSTS.filter(function (x) { return x.slug === b; })[0]; buf = p ? bufPost(p) : bufMissing(route); }
  else if (a === "projects" && !b) buf = bufProjects();
  else if (a === "projects") { var q = PROJECTS.filter(function (x) { return x.slug === b; })[0]; buf = q ? bufProject(q) : bufMissing(route); }
  else if (a === "about") buf = bufAbout();
  else if (a === "help") buf = bufHelp();
  else buf = bufMissing(route);
  buf.key = "/" + parts.filter(Boolean).join("/");
  return buf;
}

/* ---------- rendering ---------- */

var $buf = document.getElementById("buf");
var $tabs = document.getElementById("tabs");
var $status = document.getElementById("status");
var $msg = document.getElementById("msg");
var $in = document.getElementById("cmdin");
var $showcmd = document.getElementById("showcmd");
var $exit = document.getElementById("exit");

var TABS = [ ["/", "home.md"], ["/blog", "blog/"], ["/projects", "projects/"], ["/about", "about.md"] ];

function tabIndex() {
  var r = S.buf.key;
  for (var i = TABS.length - 1; i >= 0; i--) {
    if (r === TABS[i][0] || (TABS[i][0] !== "/" && r.indexOf(TABS[i][0] + "/") === 0)) return i;
  }
  return r === "/" ? 0 : -1;
}

function renderTabs() {
  var key = S.buf.key, html = "", exact = false;
  TABS.forEach(function (t, i) {
    var on = key === t[0];
    if (on) exact = true;
    html += '<a href="#' + t[0] + '"' + (on ? ' class="on" aria-current="page"' : "") + '><span class="n">' + (i + 1) + "</span>" + t[1] + "</a>";
  });
  if (!exact) html += '<a href="#' + esc(key) + '" class="on" aria-current="page"><span class="n">' + (TABS.length + 1) + "</span>" + esc(S.buf.name) + "</a>";
  html += '<span class="fill"></span><span class="host">tthisk.com</span>';
  $tabs.innerHTML = html;
}

function num(i, c) {
  if (!S.rnu) return String(i + 1);
  if (i === c) return String(i + 1);
  return String(Math.abs(i - c));
}

function curIdx() { return S.cur[S.buf.key]; }

function renderStatus() {
  var b = S.buf, c = curIdx(), n = b.lines.length;
  var pct = c === 0 ? "Top" : c === n - 1 ? "Bot" : Math.round(c / (n - 1) * 100) + "%";
  var mode = document.body.classList.contains("cmdmode") ? "COMMAND" : "NORMAL";
  $status.innerHTML =
    sp("mode", mode) + sp("seg2 wide", "main") + sp("seg fname", esc(b.name)) + sp("seg wide", "[RO]") +
    sp("fill", "") + sp("seg wide", esc(b.ft || "")) + sp("seg wide", "utf-8") + sp("seg", pct) +
    sp("pos", (c + 1) + ":1");
}

function render() {
  S.buf = resolve(S.route);
  var b = S.buf;
  if (S.cur[b.key] == null) S.cur[b.key] = b.start || 0;
  S.cur[b.key] = Math.min(S.cur[b.key], b.lines.length - 1);
  var c = S.cur[b.key];
  document.body.classList.toggle("nonu", !S.nu && !S.rnu);
  $buf.innerHTML = b.lines.map(function (ln, i) {
    return '<div class="row' + (i === c ? " cl" : "") + (ln.go ? " act" : "") + '" data-i="' + i + '">' +
      '<span class="nr">' + num(i, c) + '</span><span class="tx">' + (ln.h || " ") + "</span></div>";
  }).join("");
  fillTildes();
  renderTabs();
  renderStatus();
  document.title = b.name + " - nvim ~ tthisk.com";
}

function fillTildes() {
  var old = $buf.querySelectorAll(".tilde");
  for (var k = 0; k < old.length; k++) old[k].remove();
  var first = $buf.querySelector(".row");
  if (!first) return;
  var rowH = first.offsetHeight || 24;
  var rows = $buf.querySelectorAll(".row");
  var last = rows[rows.length - 1];
  var used = last.offsetTop + last.offsetHeight - $buf.offsetTop;
  var free = $buf.clientHeight - used;
  var count = Math.max(0, Math.floor(free / rowH));
  var html = "";
  for (var t = 0; t < count; t++) html += '<div class="row tilde" aria-hidden="true"><span class="tx">~</span></div>';
  $buf.insertAdjacentHTML("beforeend", html);
}

function paintCursor() {
  var c = curIdx();
  var rows = $buf.querySelectorAll(".row[data-i]");
  for (var i = 0; i < rows.length; i++) {
    rows[i].classList.toggle("cl", i === c);
    rows[i].firstChild.textContent = num(i, c);
  }
  if (rows[c]) rows[c].scrollIntoView({ block: "nearest" });
  renderStatus();
}

function setCursor(i) {
  var n = S.buf.lines.length;
  S.cur[S.buf.key] = Math.max(0, Math.min(n - 1, i));
  paintCursor();
}

function say(text, kind) {
  $msg.className = kind || "";
  $msg.innerHTML = text;
}
function hint() {
  say('<span class="keys">press : for commands, ? for help, or just click</span>' +
      '<span class="touch">tap a line to open it, tap here to type a command</span>', "hint");
}

/* ---------- navigation ---------- */

function go(target) {
  if (!target) return;
  if (target === "toggle:hidden") return toggleHidden();
  if (target.charAt(0) === "#") {
    if (location.hash === target || (target === "#/" && !location.hash)) render();
    else location.hash = target;
  } else {
    location.href = target;
  }
}

function follow() {
  var ln = S.buf.lines[curIdx()];
  if (ln && ln.go) go(ln.go);
}

function up() {
  var r = S.buf.key;
  if (r === "/") return say("Already at the top. There is no ../ above home.", "");
  go("#" + (r.substring(0, r.lastIndexOf("/")) || "/"));
}

function switchTab(i) {
  var n = TABS.length;
  i = ((i % n) + n) % n;
  go("#" + TABS[i][0]);
}

function relTab(d) {
  var i = tabIndex();
  switchTab((i < 0 ? 0 : i) + d);
}

function toggleHidden() {
  S.hidden = !S.hidden;
  if (S.buf.key === "/blog") {
    render();
    setCursor(3);
  }
  say(S.hidden ? "hidden files: shown" : "hidden files: hidden", "");
}

function onRoute() {
  var r = decodeURIComponent(location.hash.replace(/^#/, "")) || "/";
  S.route = r;
  render();
  $buf.scrollTop = 0;
  paintCursor();
  if (S.welcome) { say("Welcome back. Nobody ever really leaves. (1 of 2 secrets found)", ""); S.welcome = false; }
  else if (S.firstLoad) { hint(); S.firstLoad = false; }
  else say('"' + esc(S.buf.name) + '" ' + S.buf.lines.length + "L, read-only", "");
}

/* ---------- the :q easter egg ---------- */

var QUIT = [
  "E37: No write since last change (add ! to override)",
  "E37: Still no. This is a website. There is nothing to quit.",
  "Hint: your browser has a little x in the corner of the tab.",
  "You are not alone. Millions have asked how to exit this editor."
];

function quit() {
  if (S.quits < QUIT.length) {
    say(esc(QUIT[S.quits]), "error");
    S.quits++;
    return;
  }
  S.quits = 0;
  $exit.innerHTML =
    '<span class="dim">[Process exited 0]</span>\n\n' +
    "nvim has closed.\nUnfortunately, you are still on the website.\n\n" +
    '<span class="dim">press any key to restart</span> <span class="blink">_</span>';
  $exit.hidden = false;
  $exit.focus();
}

function restart() {
  $exit.hidden = true;
  S.welcome = true;
  if (location.hash && location.hash !== "#/") location.hash = "#/";
  else onRoute();
}
$exit.addEventListener("click", restart);
$exit.tabIndex = -1;

/* ---------- command line ---------- */

var NAMES = { "": "/", "~": "/", "/": "/", "home": "/", "home.md": "/", "index": "/",
  "blog": "/blog", "blog/": "/blog", "posts": "/blog",
  "projects": "/projects", "projects/": "/projects",
  "about": "/about", "about.md": "/about",
  "help": "/help", "help.txt": "/help", ".secret": "/blog/.secret", "blog/.secret": "/blog/.secret" };

function lookup(name) {
  name = name.replace(/^\.\//, "");
  if (NAMES.hasOwnProperty(name)) return NAMES[name];
  var slug = name.replace(/^blog\//, "").replace(/\.md$/, "");
  if (POSTS.some(function (p) { return p.slug === slug; })) return "/blog/" + slug;
  var proj = name.replace(/^projects\//, "").replace(/\/(README\.md)?$/, "");
  if (PROJECTS.some(function (p) { return p.slug === proj; })) return "/projects/" + proj;
  return null;
}

function completions() {
  return Object.keys(NAMES).filter(function (k) { return /^[a-z]+$/.test(k) && k !== "index" && k !== "posts"; })
    .concat(POSTS.map(function (p) { return p.slug; }), PROJECTS.map(function (p) { return p.slug; }));
}

function enterCmd() {
  document.body.classList.add("cmdmode");
  $in.value = "";
  $in.focus();
  renderStatus();
}
function leaveCmd() {
  document.body.classList.remove("cmdmode");
  $in.blur();
  renderStatus();
}

function exec(raw) {
  var c = raw.trim().replace(/^:+/, "");
  if (!c) return;
  if (/^\d+$/.test(c)) return setCursor(parseInt(c, 10) - 1);
  var m = c.match(/^(\S+?)(!?)(?:\s+(.*))?$/);
  if (!m) return say("E492: Not an editor command: " + esc(c), "error");
  var w = m[1], arg = (m[3] || "").trim();
  switch (w) {
    case "e": case "edit": case "o": case "open": case "tabe": case "tabedit":
      if (!arg) return say("E32: No file name", "error");
      var r = lookup(arg);
      if (!r) return say("E484: Can't open file " + esc(arg), "error");
      return go("#" + r);
    case "bn": case "bnext": case "tabn": case "tabnext": return relTab(1);
    case "bp": case "bprev": case "bprevious": case "bN": case "tabp": case "tabprevious": return relTab(-1);
    case "b": case "buffer":
      var n = parseInt(arg, 10);
      if (n >= 1 && n <= TABS.length) return switchTab(n - 1);
      var rb = lookup(arg);
      return rb ? go("#" + rb) : say("E94: No matching buffer for " + esc(arg), "error");
    case "h": case "help": return go("#/help");
    case "q": case "quit": case "wq": case "x": case "xit": case "qa": case "qall": case "wqa": case "exit": case "close":
      return quit();
    case "w": case "write": case "sav": case "saveas":
      return say("E45: 'readonly' option is set (it's a website)", "error");
    case "set": case "se":
      var opt = arg.replace(/\s+/g, "");
      if (opt === "nu" || opt === "number") S.nu = true;
      else if (opt === "nonu" || opt === "nonumber") S.nu = false;
      else if (opt === "rnu" || opt === "relativenumber") S.rnu = true;
      else if (opt === "nornu" || opt === "norelativenumber") S.rnu = false;
      else return say("E518: Unknown option: " + esc(arg), "error");
      render(); paintCursor();
      return say(":set " + esc(opt), "");
    case "noh": case "nohlsearch": return hint();
    default:
      return say("E492: Not an editor command: " + esc(c), "error");
  }
}

$in.addEventListener("keydown", function (e) {
  e.stopPropagation();
  if (e.key === "Enter") { e.preventDefault(); var v = $in.value; leaveCmd(); hint(); exec(v); }
  else if (e.key === "Escape") { e.preventDefault(); leaveCmd(); hint(); }
  else if (e.key === "Backspace" && !$in.value) { e.preventDefault(); leaveCmd(); hint(); }
  else if (e.key === "Tab") {
    e.preventDefault();
    var m = $in.value.match(/^(\s*(?:e|edit|b|buffer|tabe)\s+)(\S*)$/);
    if (!m) return;
    var hits = completions().filter(function (k) { return k.indexOf(m[2]) === 0; });
    if (hits.length === 1) $in.value = m[1] + hits[0];
    else if (hits.length > 1) say(hits.map(esc).join("  "), "");
  }
});
$in.addEventListener("blur", function () {
  if (document.body.classList.contains("cmdmode")) { document.body.classList.remove("cmdmode"); renderStatus(); }
});
document.getElementById("cmd").addEventListener("click", function () {
  if (!document.body.classList.contains("cmdmode")) enterCmd();
});

/* ---------- keys and clicks ---------- */

document.addEventListener("keydown", function (e) {
  if (!$exit.hidden) { e.preventDefault(); restart(); return; }
  if (e.target === $in) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var k = e.key;
  if (k === "Enter" && e.target.closest && e.target.closest("a")) return;

  if (S.pending) {
    var p = S.pending + k;
    S.pending = ""; $showcmd.textContent = "";
    if (p === "gg") setCursor(0);
    else if (p === "gt") relTab(1);
    else if (p === "gT") relTab(-1);
    else if (p === "g.") toggleHidden();
    else if (p === "ZZ" || p === "ZQ") quit();
    else return;
    e.preventDefault();
    return;
  }

  switch (k) {
    case "j": case "ArrowDown": setCursor(curIdx() + 1); break;
    case "k": case "ArrowUp": setCursor(curIdx() - 1); break;
    case "G": case "End": setCursor(S.buf.lines.length - 1); break;
    case "Home": setCursor(0); break;
    case "g": case "Z": S.pending = k; $showcmd.textContent = k; break;
    case "Enter": case "l": case "ArrowRight": follow(); break;
    case "-": case "h": case "ArrowLeft": case "Backspace": up(); break;
    case ":": enterCmd(); break;
    case "?": go("#/help"); break;
    case "1": case "2": case "3": case "4": switchTab(+k - 1); break;
    case "Escape": hint(); break;
    default: return;
  }
  e.preventDefault();
});

$buf.addEventListener("click", function (e) {
  var row = e.target.closest(".row[data-i]");
  if (!row) return;
  var sel = window.getSelection && String(window.getSelection());
  if (sel) return;
  setCursor(+row.getAttribute("data-i"));
  if (e.target.closest("a")) return;
  follow();
});

window.addEventListener("hashchange", onRoute);
window.addEventListener("resize", fillTildes);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fillTildes);

onRoute();
</script>
</body>
</html>
