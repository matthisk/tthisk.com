<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tthisk — phosphor terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --phos: #33ff66;
    --phos-dim: #1a9940;
    --phos-faint: #0d4d20;
    --glow: rgba(51, 255, 102, 0.55);
    --bg: #020a04;
  }
  body.amber {
    --phos: #ffb000;
    --phos-dim: #a87400;
    --phos-faint: #4d3500;
    --glow: rgba(255, 176, 0, 0.5);
    --bg: #0a0600;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at center, #1b1b1b 0%, #050505 70%);
    font-family: "VT323", ui-monospace, monospace;
    color: var(--phos);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2.5vmin;
  }

  /* ---- the monitor bezel ---- */
  .bezel {
    position: relative;
    width: min(1200px, 100%);
    height: min(860px, 100%);
    padding: 34px;
    border-radius: 28px;
    background: linear-gradient(160deg, #3a3833 0%, #24231f 45%, #171613 100%);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.08),
      inset 0 -6px 18px rgba(0,0,0,.6),
      0 30px 80px rgba(0,0,0,.7);
  }
  .bezel::after {
    content: "TTHISK-80 · MONOCHROME DISPLAY";
    position: absolute;
    bottom: 9px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    letter-spacing: .3em;
    color: #77736a;
  }
  .led {
    position: absolute;
    right: 40px;
    bottom: 12px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--phos);
    box-shadow: 0 0 8px var(--phos);
  }

  /* ---- the glass ---- */
  .screen {
    position: relative;
    height: 100%;
    border-radius: 22px / 26px;
    background: radial-gradient(ellipse at center, color-mix(in srgb, var(--phos) 7%, var(--bg)) 0%, var(--bg) 75%);
    overflow: hidden;
    box-shadow: inset 0 0 90px rgba(0,0,0,.95), inset 0 0 20px rgba(0,0,0,.9);
  }
  /* scanlines */
  .screen::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.28) 3px);
    pointer-events: none;
    z-index: 3;
  }
  /* vignette and glass reflection */
  .screen::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 30% 10%, rgba(255,255,255,.06), transparent 40%),
      radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.55) 100%);
    pointer-events: none;
    z-index: 4;
  }
  .roll {
    position: absolute;
    left: 0; right: 0;
    height: 120px;
    background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--phos) 6%, transparent), transparent);
    animation: roll 7s linear infinite;
    pointer-events: none;
    z-index: 2;
  }
  @keyframes roll { from { top: -120px; } to { top: 100%; } }

  .term {
    position: relative;
    height: 100%;
    overflow-y: auto;
    padding: 28px 36px 36px;
    font-size: 23px;
    line-height: 1.2;
    text-shadow: 0 0 2px var(--phos), 0 0 9px var(--glow);
    animation: flicker 4s infinite steps(1);
    scrollbar-width: none;
    z-index: 1;
  }
  .term::-webkit-scrollbar { display: none; }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    47% { opacity: .96; }
    48% { opacity: 1; }
    83% { opacity: .98; }
  }

  .line { white-space: pre-wrap; word-break: break-word; min-height: 1.2em; }
  .dim { color: var(--phos-dim); text-shadow: 0 0 6px color-mix(in srgb, var(--glow) 50%, transparent); }
  .inv { background: var(--phos); color: var(--bg); text-shadow: none; padding: 0 .3em; }
  .banner { line-height: 1.02; font-size: 22px; }
  a, .cmd {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px dashed var(--phos-dim);
    cursor: pointer;
  }
  a:hover, .cmd:hover, a:focus-visible, .cmd:focus-visible {
    background: var(--phos);
    color: var(--bg);
    text-shadow: none;
    outline: none;
  }

  .post {
    display: grid;
    grid-template-columns: 12ch 1fr;
    gap: 0 2ch;
  }
  .post > span { justify-self: start; }
  .post .title { cursor: pointer; }
  .post .title:hover { background: var(--phos); color: var(--bg); text-shadow: none; }

  .prompt-row { display: flex; gap: 1ch; align-items: baseline; }
  .prompt-row .ps1 { white-space: nowrap; }
  .input-wrap { position: relative; flex: 1; }
  #input {
    position: absolute;
    inset: 0;
    opacity: 0;
    font: inherit;
    border: 0;
    background: none;
    color: transparent;
    caret-color: transparent;
  }
  #echo { white-space: pre; }
  .cursor {
    display: inline-block;
    width: .6em;
    height: 1em;
    vertical-align: -0.12em;
    background: var(--phos);
    box-shadow: 0 0 8px var(--glow);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .hint { position: absolute; right: 36px; top: 26px; font-size: 18px; z-index: 5; }

  @media (max-width: 700px) {
    .bezel { padding: 14px; border-radius: 14px; }
    .term { font-size: 18px; padding: 16px; }
    .banner { font-size: 13px; }
    .post { grid-template-columns: 1fr; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .term, .roll, .cursor { animation: none; }
  }
</style>
</head>
<body>
  <div class="bezel">
    <div class="screen" id="screen">
      <div class="roll" aria-hidden="true"></div>
      <span class="hint dim">[ type <span class="cmd" data-run="help">help</span> · <span class="cmd" data-run="theme">theme</span> ]</span>
      <main class="term" id="term" aria-live="polite">
        <div id="out"></div>
        <div class="prompt-row" id="prompt" hidden>
          <span class="ps1">guest@tthisk:~$</span>
          <label class="input-wrap">
            <span id="echo"></span><span class="cursor"></span>
            <input id="input" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="terminal command">
          </label>
        </div>
      </main>
    </div>
    <span class="led" aria-hidden="true"></span>
  </div>

<script>
(() => {
  const out = document.getElementById("out");
  const term = document.getElementById("term");
  const prompt = document.getElementById("prompt");
  const input = document.getElementById("input");
  const echo = document.getElementById("echo");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- content (placeholder) ----------
  const posts = [
    { date: "2026-10-28", slug: "tiny-lisp-in-rust", title: "Writing a tiny Lisp in a weekend", tags: "rust, compilers" },
    { date: "2026-09-14", slug: "boring-technology", title: "In defence of boring technology", tags: "opinion" },
    { date: "2026-08-02", slug: "crdts-for-humans", title: "CRDTs explained without the math", tags: "distributed-systems" },
    { date: "2026-06-19", slug: "dotfiles-2026", title: "My dotfiles, ten years later", tags: "tooling" },
  ];
  const projects = [
    { name: "tthisk.com", desc: "This website. Hand-written HTML, no framework, plenty of nostalgia." },
    { name: "kvlite", desc: "An embeddable key-value store with an LSM tree, written to learn storage engines." },
    { name: "termplot", desc: "Plots in your terminal using braille characters. Pipe numbers in, get charts out." },
  ];

  // ---------- figlet-ish banner, built from glyphs so it stays aligned ----------
  const G = {
    t: [String.raw` _   `, String.raw`| |_ `, String.raw`| __|`, String.raw`| |_ `, String.raw` \__|`],
    h: [String.raw` _     `, String.raw`| |__  `, String.raw`| '_ \ `, String.raw`| | | |`, String.raw`|_| |_|`],
    i: [String.raw` _ `, String.raw`(_)`, String.raw`| |`, String.raw`| |`, String.raw`|_|`],
    s: [String.raw`     `, String.raw` ___ `, String.raw`/ __|`, "\\__ \\", String.raw`|___/`],
    k: [String.raw` _    `, String.raw`| | __`, String.raw`| |/ /`, String.raw`|   < `, "|_|\\_\\"],
  };
  const banner = [0,1,2,3,4].map(r => [..."tthisk"].map(c => G[c][r]).join("")).join("\n");

  // ---------- output helpers ----------
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const scroll = () => { term.scrollTop = term.scrollHeight; };
  function print(html = "", cls = "") {
    const d = document.createElement("div");
    d.className = "line " + cls;
    d.innerHTML = html;
    out.appendChild(d);
    scroll();
    return d;
  }
  const sleep = ms => new Promise(r => setTimeout(r, reduced ? 0 : ms));
  async function type(text, cls = "", speed = 14) {
    const d = print("", cls);
    if (reduced) { d.textContent = text; return; }
    for (const ch of text) { d.textContent += ch; scroll(); await sleep(speed); }
  }
  const c = (cmd, label = cmd) => `<span class="cmd" tabindex="0" data-run="${esc(cmd)}">${esc(label)}</span>`;

  // ---------- commands ----------
  const commands = {
    help() {
      print("Available commands:");
      [
        ["about", "who is behind this terminal"],
        ["blog", "list recent posts"],
        ["read <n>", "open post number n"],
        ["projects", "things I have built"],
        ["contact", "ways to reach me"],
        ["theme", "toggle green / amber phosphor"],
        ["clear", "wipe the screen"],
      ].forEach(([k, v]) => print(`  ${c(k.split(" ")[0], k.padEnd(10))}  <span class="dim">${v}</span>`));
    },
    about() {
      print(`<span class="inv"> ABOUT </span>`);
      print("Hi, I'm Matthis — a software engineer who likes small tools,");
      print("big ideas, and computers that go <i>beep</i>.");
      print("");
      print("I write about systems, tooling and the craft of building software.");
      print(`<span class="dim">Full page coming soon → /about</span>`);
    },
    blog() {
      print(`<span class="inv"> /var/log/blog </span>  <span class="dim">${posts.length} entries</span>`);
      posts.forEach((p, i) => {
        print(`<div class="post"><span class="dim">${p.date}</span><span><span class="title cmd" tabindex="0" data-run="read ${i + 1}">[${i + 1}] ${esc(p.title)}</span> <span class="dim">#${esc(p.tags)}</span></span></div>`);
      });
      print(`<span class="dim">type ${c("read 1")} to open a post</span>`);
    },
    read(n) {
      const p = posts[Number(n) - 1];
      if (!p) return print(`read: no such post: ${esc(n || "")}`);
      print(`<span class="inv"> ${esc(p.title.toUpperCase())} </span>`);
      print(`<span class="dim">${p.date} · /blog/${p.slug}</span>`);
      print("Placeholder body. Once we settle on a design, posts will live on");
      print("their own pages and this command will open them.");
    },
    projects() {
      print(`<span class="inv"> ~/projects </span>`);
      projects.forEach(p => {
        print(`drwxr-xr-x  ${esc(p.name.padEnd(12))} <span class="dim">${esc(p.desc)}</span>`);
      });
    },
    contact() {
      print(`github   <a href="https://github.com/matthisk" target="_blank" rel="noopener">github.com/matthisk</a>`);
      print(`web      <a href="https://tthisk.com">tthisk.com</a>`);
    },
    ls() { print(`${c("about")}  ${c("blog")}  ${c("projects")}  ${c("contact")}`); },
    whoami() { print("guest — but you're welcome here."); },
    date() { print(new Date().toString()); },
    theme() {
      document.body.classList.toggle("amber");
      print(`phosphor set to ${document.body.classList.contains("amber") ? "P3 amber" : "P1 green"}.`);
    },
    clear() { out.innerHTML = ""; },
    sudo() { print("guest is not in the sudoers file. This incident will be reported."); },
    exit() { print("There is no escape. Try " + c("help") + "."); },
  };
  commands.cat = commands.read;
  commands.cd = arg => (commands[arg] ? commands[arg]() : print(`cd: ${esc(arg || "")}: No such directory`));

  const history = [];
  let hIdx = 0;
  function run(raw) {
    const line = raw.trim();
    print(`<span class="dim">guest@tthisk:~$</span> ${esc(line)}`);
    if (!line) return;
    history.push(line); hIdx = history.length;
    const [cmd, ...args] = line.split(/\s+/);
    const fn = commands[cmd.toLowerCase()];
    if (fn) fn(...args); else print(`${esc(cmd)}: command not found. Try ${c("help")}.`);
    print("");
  }

  // ---------- input handling ----------
  input.addEventListener("input", () => { echo.textContent = input.value; });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") { run(input.value); input.value = ""; echo.textContent = ""; }
    else if (e.key === "ArrowUp" && history.length) { hIdx = Math.max(0, hIdx - 1); input.value = history[hIdx]; echo.textContent = input.value; e.preventDefault(); }
    else if (e.key === "ArrowDown") { hIdx = Math.min(history.length, hIdx + 1); input.value = history[hIdx] || ""; echo.textContent = input.value; }
    else if (e.key === "Tab") {
      e.preventDefault();
      const m = Object.keys(commands).filter(k => k.startsWith(input.value));
      if (m.length === 1) { input.value = m[0]; echo.textContent = m[0]; }
    }
    else if (e.key === "l" && e.ctrlKey) { e.preventDefault(); commands.clear(); }
  });
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-run]");
    if (t) { run(t.dataset.run); }
    if (!getSelection().toString()) input.focus();
  });
  document.addEventListener("keydown", e => {
    const t = e.target.closest && e.target.closest("[data-run]");
    if (t && e.key === "Enter") { e.preventDefault(); run(t.dataset.run); input.focus(); }
  });

  // ---------- boot sequence ----------
  async function boot() {
    print("TTHISK-80 ROM BIOS v2.6  (c) 1986-2026", "dim");
    const mem = print("", "dim");
    for (let k = 0; k <= 640; k += 32) { mem.textContent = `Memory test: ${String(k).padStart(4)}K OK`; await sleep(18); }
    await type("Detecting drives...  hd0: 1 x curiosity, 0 bad sectors", "dim", 6);
    await type("Loading tthisk/os ......................... done", "dim", 6);
    await sleep(250);
    print("");
    print(esc(banner), "banner");
    print("");
    await type("Personal site of Matthis · software engineer · writes about systems & tooling.", "", 12);
    print("");
    print(`<span class="inv"> LATEST </span>`);
    posts.slice(0, 3).forEach((p, i) =>
      print(`<div class="post"><span class="dim">${p.date}</span><span class="title cmd" tabindex="0" data-run="read ${i + 1}">${esc(p.title)}</span></div>`));
    print("");
    print(`Explore: ${c("about")}  ${c("blog")}  ${c("projects")}  ${c("contact")}   <span class="dim">or type ${c("help")}</span>`);
    print("");
    prompt.hidden = false;
    input.focus();
    scroll();
  }
  boot();
})();
</script>
</body>
</html>
