<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tthisk — BIOS Setup Utility</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #0000aa;
    --cyan: #55ffff;
    --gray: #aaaaaa;
    --white: #ffffff;
    --yellow: #ffff55;
    --dblue: #000080;
    --black: #000000;
    --red: #aa0000;
    /* 80 columns fill the viewport width, capped */
    --cell: min(calc((100vw - 32px) / 80 / .6), calc((100vh - 32px) / 30 / 1.25), 22px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; }
  body {
    font-family: "IBM Plex Mono", "Courier New", monospace;
    font-weight: 600;
    font-size: var(--cell);
    line-height: 1.25;
    display: grid;
    place-items: center;
    color: var(--white);
    overflow: hidden;
    cursor: default;
    user-select: none;
  }
  .screen {
    width: 80ch;
    height: 30lh;
    height: calc(30 * 1.25em);
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--blue);
    image-rendering: pixelated;
  }
  /* subtle CRT softness */
  .screen::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,0,0,.12) 2px 3px);
    pointer-events: none;
  }

  /* ---------- POST screen ---------- */
  #post {
    position: absolute;
    inset: 0;
    background: #000;
    color: var(--gray);
    padding: .5em 1ch;
    white-space: pre;
    z-index: 20;
    font-weight: 400;
  }
  #post .hi { color: var(--white); font-weight: 700; }
  #post .logo { position: absolute; top: .5em; right: 2ch; color: var(--cyan); line-height: 1.1; }
  #post .bottom { position: absolute; left: 1ch; bottom: .5em; }
  #post[hidden] { display: none; }

  /* ---------- setup chrome ---------- */
  .title {
    text-align: center;
    color: var(--cyan);
    background: var(--blue);
    padding-top: .1em;
  }
  .menubar {
    display: flex;
    background: var(--blue);
    color: var(--white);
    padding: 0 1ch;
  }
  .menubar button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0 2ch;
    cursor: default;
  }
  .menubar button.on { background: var(--gray); color: var(--blue); }
  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 54ch 1fr;
    background: var(--gray);
    color: var(--blue);
    margin: 0 1ch;
    border: .15em double var(--blue);
    border-width: 0 .3em;
    min-height: 0;
  }
  .items { padding: .5em 2ch; border-right: .15em solid var(--blue); overflow: hidden; }
  .help { padding: .5em 2ch; color: var(--blue); }
  .help h3 { margin: 0 0 .5em; font: inherit; text-align: center; border-bottom: .12em solid var(--blue); padding-bottom: .25em; }
  .help p { margin: 0 0 1em; font-weight: 400; color: var(--black); white-space: pre-wrap; }

  .row { display: grid; grid-template-columns: 24ch 1fr; white-space: pre; }
  .row.info { color: var(--black); font-weight: 400; }
  .row.head { color: var(--black); font-weight: 700; margin-top: .5em; }
  .row.sel .val, .row.sel.link .key, .row.sel.action .key { background: var(--white); color: var(--blue); }
  .row.link .key::before { content: "► "; }
  .row .val { justify-self: start; }
  .row.text { grid-template-columns: 1fr; white-space: pre-wrap; color: var(--black); font-weight: 400; }
  .row.sel { cursor: default; }
  .row.sel.action .key, .row.sel.link .key { padding-right: 1ch; }

  .keys {
    display: grid;
    grid-template-columns: repeat(4, auto);
    justify-content: space-between;
    background: var(--blue);
    color: var(--white);
    padding: .1em 3ch .2em;
    font-weight: 400;
  }
  .keys b { color: var(--yellow); font-weight: 700; }
  .copy { text-align: center; color: var(--cyan); font-weight: 400; padding-bottom: .2em; }

  /* ---------- dialogs ---------- */
  .dialog {
    position: absolute;
    left: 50%;
    top: 46%;
    transform: translate(-50%, -50%);
    background: var(--red);
    color: var(--white);
    padding: .4em 1ch;
    box-shadow: 1ch 1em 0 rgba(0,0,0,.6);
    z-index: 10;
    max-width: 60ch;
  }
  .dialog.blue { background: var(--dblue); }
  .dialog .frame {
    border: .2em double var(--white);
    padding: .3em 2ch .6em;
  }
  .dialog .frame > h4 { margin: -.95em auto .4em; width: max-content; background: inherit; padding: 0 1ch; font: inherit; color: var(--yellow); }
  .dialog.blue .frame > h4 { background: var(--dblue); }
  .dialog:not(.blue) .frame > h4 { background: var(--red); }
  .dialog p { margin: 0 0 .6em; font-weight: 400; white-space: pre-wrap; }
  .dialog .opts { display: flex; flex-direction: column; align-items: stretch; }
  .dialog .opts.inline { flex-direction: row; justify-content: center; gap: 4ch; }
  .dialog .opt { padding: 0 1ch; }
  .dialog .opt.sel { background: var(--white); color: var(--blue); }
  [hidden] { display: none !important; }

  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
</style>
</head>
<body>
<div class="screen" id="screen" role="application" aria-label="tthisk BIOS setup">

  <div id="post"></div>

  <div class="title">TTHISK BIOS SETUP UTILITY</div>
  <nav class="menubar" id="menubar"></nav>
  <div class="main">
    <div class="items" id="items" role="listbox"></div>
    <aside class="help">
      <h3>Item Specific Help</h3>
      <p id="help"></p>
    </aside>
  </div>
  <div class="keys">
    <span><b>↑↓</b> Select Item</span>
    <span><b>Enter</b> Select ► Sub-Menu</span>
    <span><b>F9</b> Setup Defaults</span>
    <span><b>Esc</b> Exit</span>
    <span><b>←→</b> Select Menu</span>
    <span><b>-/+</b> Change Values</span>
    <span><b>F10</b> Save and Exit</span>
    <span><b>F1</b> General Help</span>
  </div>
  <div class="copy">v02.61 (C) Copyright 1985-2026, tthisk Megatrends, Inc.</div>

  <div class="dialog" id="dialog" hidden>
    <div class="frame">
      <h4 id="d-title"></h4>
      <p id="d-body"></p>
      <div class="opts" id="d-opts"></div>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pad2 = n => String(n).padStart(2, "0");

  // ---------------- content (placeholder) ----------------
  const posts = [
    ["Writing a tiny Lisp in a weekend", "10/28/2026", "A reader, an evaluator and a REPL in ~400 lines of Rust. What I learned about parsing, environments and why everyone should build one once."],
    ["In defence of boring technology", "09/14/2026", "Postgres, cron and a single server will get you further than you think. A love letter to tools that just work."],
    ["CRDTs explained without the math", "08/02/2026", "How collaborative editors keep everyone in sync, explained with sticky notes instead of lattices."],
    ["My dotfiles, ten years later", "06/19/2026", "A decade of shell aliases, editor configs and the occasional regret, all version-controlled."],
  ];
  const projects = [
    ["tthisk.com", "Enabled", "This website. Hand-written HTML, CSS and a little JS, styled after the computers that got me hooked."],
    ["kvlite", "Enabled", "An embeddable key-value store with an LSM tree, write-ahead log and compaction. Built to learn how storage engines work."],
    ["termplot", "Enabled", "Plots in your terminal using braille characters. Pipe numbers in, get charts out."],
    ["Side project #47", "Disabled", "Abandoned at 80%. Like most of them. Kept here for honesty."],
  ];

  const state = { coffee: "High", indent: "Spaces", theme: "Dark" };
  const DEFAULTS = { ...state };

  const menus = [
    { name: "Main", items: () => [
      { type: "value", key: "System Time", val: () => { const d = new Date(); return `[${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}]`; },
        help: "The current time.\nIt keeps ticking whether you\nread the blog or not." },
      { type: "value", key: "System Date", val: () => { const d = new Date(); return `[${pad2(d.getMonth() + 1)}/${pad2(d.getDate())}/${d.getFullYear()}]`; },
        help: "Today's date, straight from\nyour real-time clock." },
      { type: "info", key: "Owner", val: "Matthis" },
      { type: "info", key: "Occupation", val: "Software Engineer" },
      { type: "info", key: "Home Page", val: "tthisk.com" },
      { type: "head", key: "Navigation" },
      { type: "link", key: "Blog Posts", go: 1, help: "Long-form writing about\nsystems, tooling and the\ncraft of building software." },
      { type: "link", key: "Projects", go: 2, help: "Things I have built, with\nsome context on why and how." },
      { type: "link", key: "About Me", go: 3, help: "Who I am, what I do and how\nto get in touch." },
      { type: "head", key: "System Configuration" },
      { type: "option", key: "Coffee Level", prop: "coffee", opts: ["Low", "Medium", "High", "Overclocked"],
        help: "Sets caffeine intake.\n\nOverclocked: may cause\ninstability and very long\nblog posts." },
      { type: "info", key: "Base Memory", val: "640 KB" },
      { type: "info", key: "Extended Memory", val: "∞ KB curiosity" },
    ]},
    { name: "Blog", items: () => [
      { type: "head", key: "Recent Posts" },
      ...posts.map(([t, d, s]) => ({ type: "link", key: t.length > 34 ? t.slice(0, 33) + "…" : t, wide: true, val: d, open: { title: t, body: `${d}\n\n${s}` },
        help: `${d}\n\n${s}` })),
      { type: "head", key: "Statistics" },
      { type: "info", key: "Total Posts", val: String(posts.length) },
      { type: "info", key: "Words Written", val: "~ 21,000" },
    ]},
    { name: "Projects", items: () => [
      { type: "head", key: "Installed Projects" },
      ...projects.map(([n, st, d]) => ({ type: "link", key: n, val: `[${st}]`, open: { title: n, body: d }, help: d })),
    ]},
    { name: "About", items: () => [
      { type: "text", key: "Hi, I'm Matthis. I'm a software\nengineer who likes small tools, big\nideas, and computers that boot with\na beep.\n" },
      { type: "option", key: "Indentation", prop: "indent", opts: ["Spaces", "Tabs", "Whatever gofmt says"],
        help: "A deeply held belief.\nChange at your own risk." },
      { type: "option", key: "Editor Theme", prop: "theme", opts: ["Dark", "Light", "Solarized", "Hacker Green"],
        help: "Appearance of every editor\nI open." },
      { type: "head", key: "Contact" },
      { type: "action", key: "GitHub", val: "github.com/matthisk", run: () => window.open("https://github.com/matthisk", "_blank", "noopener"),
        help: "Opens my GitHub profile\nin a new tab." },
    ]},
    { name: "Exit", items: () => [
      { type: "action", key: "Exit Saving Changes", run: () => confirm("Save configuration changes\nand exit now?", reboot), help: "Exit system setup after\nsaving the changes.\n\nF10 key can be used for\nthis operation." },
      { type: "action", key: "Exit Discarding Changes", run: () => confirm("Quit without saving?", () => { Object.assign(state, DEFAULTS); reboot(); }), help: "Exit system setup without\nsaving any changes." },
      { type: "action", key: "Load Setup Defaults", run: loadDefaults, help: "Load default values for all\nthe setup options.\n\nF9 key can be used for\nthis operation." },
      { type: "action", key: "Read the Blog Instead", run: () => go(1), help: "Probably the best choice\non this screen." },
    ]},
  ];

  // ---------------- rendering ----------------
  let tab = 0, sel = 0, rows = [];
  const selectable = r => ["link", "option", "action", "value"].includes(r.type);

  function render() {
    $("menubar").innerHTML = menus.map((m, i) => `<button class="${i === tab ? "on" : ""}" data-tab="${i}">${m.name}</button>`).join("");
    rows = menus[tab].items();
    const sels = rows.map((r, i) => (selectable(r) ? i : -1)).filter(i => i >= 0);
    if (!sels.includes(sel)) sel = sels[0] ?? 0;
    $("items").innerHTML = rows.map((r, i) => {
      const val = typeof r.val === "function" ? r.val() : r.prop ? `[${state[r.prop]}]` : r.val ?? "";
      const cls = ["row", r.type, i === sel && selectable(r) ? "sel" : ""].join(" ");
      if (r.type === "text") return `<div class="${cls}">${r.key}</div>`;
      if (r.type === "head") return `<div class="${cls}">${r.key}</div>`;
      const cols = r.wide ? ' style="grid-template-columns:38ch 1fr"' : "";
      return `<div class="${cls}" data-i="${i}" role="option"${cols}><span class="key">${r.key}</span><span class="val">${val}</span></div>`;
    }).join("");
    const cur = rows[sel];
    $("help").textContent = ((cur && cur.help) || "").replace(/(?<!\n)\n(?!\n)/g, " ");
  }

  function go(t) { tab = (t + menus.length) % menus.length; sel = -1; render(); }
  function moveSel(d) {
    const sels = rows.map((r, i) => (selectable(r) ? i : -1)).filter(i => i >= 0);
    let k = sels.indexOf(sel) + d;
    k = (k + sels.length) % sels.length;
    sel = sels[k];
    render();
  }

  // ---------------- dialogs ----------------
  let dlg = null;
  function dialog({ title, body = "", opts, inline = false, blue = false, onPick }) {
    dlg = { opts, i: 0, onPick };
    $("dialog").classList.toggle("blue", blue);
    $("d-title").textContent = `[ ${title} ]`;
    $("d-body").textContent = body;
    $("d-body").hidden = !body;
    $("d-opts").className = "opts" + (inline ? " inline" : "");
    drawOpts();
    $("dialog").hidden = false;
  }
  function drawOpts() {
    $("d-opts").innerHTML = dlg.opts.map((o, i) => `<span class="opt ${i === dlg.i ? "sel" : ""}" data-o="${i}">${o}</span>`).join("");
  }
  function closeDialog() { $("dialog").hidden = true; dlg = null; }
  function pick() { const d = dlg; closeDialog(); d.onPick && d.onPick(d.opts[d.i], d.i); render(); }
  function confirm(q, yes) { dialog({ title: "Setup Confirmation", body: q, opts: ["Yes", "No"], inline: true, onPick: (_, i) => i === 0 && yes() }); }
  function loadDefaults() { confirm("Load setup defaults?", () => Object.assign(state, DEFAULTS)); }

  function activate() {
    const r = rows[sel];
    if (!r) return;
    if (r.type === "link" && r.go != null) return go(r.go);
    if (r.type === "link" && r.open) return dialog({ title: r.open.title, body: r.open.body, opts: ["OK"], inline: true, blue: true });
    if (r.type === "option") {
      dialog({ title: r.key, opts: r.opts, blue: true, onPick: v => (state[r.prop] = v) });
      dlg.i = Math.max(0, r.opts.indexOf(state[r.prop]));
      drawOpts();
      return;
    }
    if (r.type === "action") r.run();
  }
  function cycle(d) {
    const r = rows[sel];
    if (r && r.type === "option") { const i = r.opts.indexOf(state[r.prop]); state[r.prop] = r.opts[(i + d + r.opts.length) % r.opts.length]; render(); }
  }

  // ---------------- input ----------------
  document.addEventListener("keydown", e => {
    if (booting) { if (e.key === "Delete" || e.key === "Escape" || e.key === "Enter" || e.key === " ") enterSetup(); return; }
    const k = e.key;
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "F1", "F9", "F10", " ", "Enter", "Escape"].includes(k)) e.preventDefault();
    if (dlg) {
      const inline = $("d-opts").classList.contains("inline");
      if (k === (inline ? "ArrowRight" : "ArrowDown")) { dlg.i = (dlg.i + 1) % dlg.opts.length; drawOpts(); }
      if (k === (inline ? "ArrowLeft" : "ArrowUp")) { dlg.i = (dlg.i - 1 + dlg.opts.length) % dlg.opts.length; drawOpts(); }
      if (k === "Enter") pick();
      if (k === "Escape") closeDialog();
      return;
    }
    if (k === "ArrowUp") moveSel(-1);
    if (k === "ArrowDown") moveSel(1);
    if (k === "ArrowLeft") go(tab - 1);
    if (k === "ArrowRight") go(tab + 1);
    if (k === "Enter") activate();
    if (k === "+" || k === "=") cycle(1);
    if (k === "-") cycle(-1);
    if (k === "Escape") go(menus.length - 1);
    if (k === "F9") loadDefaults();
    if (k === "F10") confirm("Save configuration changes\nand exit now?", reboot);
    if (k === "F1") dialog({ title: "General Help", blue: true, opts: ["Continue"], inline: true,
      body: "←→   Select menu\n↑↓   Select item\n-/+  Change option value\nEnter  Open item or sub-menu\nF9   Load defaults\nF10  Save and exit\nEsc  Exit menu\n\nMouse works too: click a\ntab, click an item twice." });
  });

  document.addEventListener("click", e => {
    if (booting) return enterSetup();
    const t = e.target.closest("[data-tab]");
    if (t && !dlg) return go(+t.dataset.tab);
    const o = e.target.closest("[data-o]");
    if (o && dlg) { dlg.i = +o.dataset.o; return pick(); }
    const r = e.target.closest("[data-i]");
    if (r && !dlg) {
      const i = +r.dataset.i;
      if (i === sel) activate(); else { sel = i; render(); }
    }
  });

  // ---------------- POST / reboot ----------------
  let booting = true, bootTimer = [];
  const LOGO = [
    "  ▄▄▄▄▄▄▄  ",
    "  █ ▀▀▀ █  ",
    "  █ ▄▄▄ █  ",
    "  ▀▀▀▀▀▀▀  ",
    " tthisk/bios",
  ].join("\n");

  function runPost() {
    booting = true;
    bootTimer.forEach(clearTimeout); bootTimer = [];
    const post = $("post");
    post.hidden = false;
    const lines = [
      `<span class="hi">tthisk Modular BIOS v4.51, (C) 1985-2026</span>`,
      `Personal Homepage Edition, Rev 1.0`,
      ``,
      `Main Processor : Human Brain @ 1 coffee/hr`,
      `__MEM__`,
      ``,
      `Detecting Primary Master   ... Curiosity 2.0`,
      `Detecting Primary Slave    ... Blog (${posts.length} posts)`,
      `Detecting Secondary Master ... Projects (${projects.length} items)`,
      `Detecting Secondary Slave  ... None`,
      ``,
      `Coffee Level : ${state.coffee}`,
      `Indentation  : ${state.indent}`,
    ];
    post.innerHTML = `<div class="logo">${LOGO}</div><div id="post-lines"></div><div class="bottom">Press <span class="hi">DEL</span> to enter SETUP<span class="blink">_</span>\n${new Date().toLocaleDateString()}-TTHISK-0001</div>`;
    const pl = $("post-lines");
    let t = 0;
    lines.forEach(l => {
      if (l === "__MEM__") {
        const d = document.createElement("div");
        bootTimer.push(setTimeout(() => pl.appendChild(d), t));
        for (let k = 0; k <= 16; k++) bootTimer.push(setTimeout(() => (d.textContent = `Memory Testing : ${String(k * 40).padStart(4)}K ${k === 16 ? "OK" : ""}`), (t += reduced ? 0 : 45)));
      } else {
        bootTimer.push(setTimeout(() => { const d = document.createElement("div"); d.innerHTML = l || " "; pl.appendChild(d); }, (t += reduced ? 0 : 110)));
      }
    });
    bootTimer.push(setTimeout(enterSetup, t + (reduced ? 300 : 1600)));
  }
  function enterSetup() {
    bootTimer.forEach(clearTimeout); bootTimer = [];
    booting = false;
    $("post").hidden = true;
    render();
  }
  function reboot() {
    closeDialog();
    const post = $("post");
    post.hidden = false;
    post.innerHTML = "";
    booting = true;
    setTimeout(() => { tab = 0; sel = -1; runPost(); }, reduced ? 0 : 600);
  }

  setInterval(() => { if (!booting && tab === 0 && !dlg) render(); }, 1000);
  runPost();
})();
</script>
</body>
</html>
